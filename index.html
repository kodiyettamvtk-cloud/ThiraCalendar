function parseCsv(csv){const rows=[];let row=[],cell='',quoted=false;csv=csv.replace(/^\uFEFF/,'');for(let i=0;i<csv.length;i++){const c=csv[i];if(c==='"'){if(quoted&&csv[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&csv[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return [];const headers=rows.shift().map(x=>x.trim());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));}
function normalize(x){return {...x,FromDate:text(x.FromDate),ToDate:text(x.ToDate)};}function valid(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d+'T12:00:00'));}function readable(d){if(!valid(d))return d;return new Date(d+'T12:00:00').toLocaleDateString(lang==='ml'?'ml-IN':'en-GB',{day:'numeric',month:'short',year:'numeric'});}function loc(e){return text(e[lang==='ml'?'LocationML':'LocationEN'])||text(e.LocationEN)||text(e.LocationML);}function dis(e){return text(e[lang==='ml'?'DistrictML':'DistrictEN'])||text(e.DistrictEN)||text(e.DistrictML);}function temple(e){return text(e[lang==='ml'?'TempleML':'TempleEN'])||text(e.TempleEN)||text(e.TempleML);}function details(e){return text(e[lang==='ml'?'ThiraDetailsML':'ThiraDetailsEN'])||text(e.ThiraDetailsEN)||text(e.ThiraDetailsML);}function phone(e){return text(e.Phone).replace(/[^\d+]/g,'');}function mapUrl(e){try{const u=new URL(text(e.MapURL));return u.protocol==='https:'&&(/(^|\.)google\.[a-z.]+$/.test(u.hostname)||u.hostname==='maps.app.goo.gl'||u.hostname==='goo.gl')?u.href:'';}catch{return '';}}function iconMap(){return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>';}function iconWa(){return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.92 9.92 0 0 0-8.56 15l-1.4 5.05 5.17-1.36A10 10 0 1 0 12.04 2zm0 18.1a8.06 8.06 0 0 1-4.1-1.12l-.3-.17-3.03.8.81-2.94-.19-.3a8.1 8.1 0 1 1 6.81 3.73zm4.43-6.04c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.55.12-.16.24-.63.78-.77.94-.14.16-.28.18-.52.06a6.58 6.58 0 0 1-1.94-1.19 7.2 7.2 0 0 1-1.34-1.66c-.14-.24-.02-.37.1-.5.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42l-.74-1.8c-.2-.48-.4-.42-.54-.42h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.31.98 2.47c.12.16 1.7 2.6 4.13 3.65.58.25 1.03.4 1.38.51.58.18 1.1.15 1.51.1.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/></svg>';}function shareUrl(e){const message=`KODIYETTAM — ${T[lang].temple}\n${temple(e)}\n${readable(e.FromDate)} – ${readable(e.ToDate)}\n\n${T[lang].details}:\n${details(e)}\n\n${T[lang].location}: ${loc(e)}, ${dis(e)}\n${T[lang].phone}: ${text(e.Phone)||'-'}\n${mapUrl(e)}\n\n${WEBSITE_URL}`;return 'https://wa.me/?text='+encodeURIComponent(message);}
function links(e){const m=mapUrl(e),wa=shareUrl(e);return `<a class="icona map ${m?'':'disabled'}" aria-label="${T[lang].map}" title="${T[lang].map}" href="${safe(m||'#')}" target="_blank" rel="noopener noreferrer">${iconMap()}</a><a class="icona wa" title="${T[lang].share}" aria-label="${T[lang].share}" href="${safe(wa)}" target="_blank" rel="noopener noreferrer">${iconWa()}</a>`;}
function card(e){const num=phone(e);return `<article class="event"><div class="eventtop"><h3 class="temple">${safe(temple(e))}</h3><span class="district">${safe(dis(e))}</span></div><div class="date">▦ ${safe(readable(e.FromDate))} – ${safe(readable(e.ToDate))}</div><div class="location">⌖ ${safe(loc(e))}</div><div class="details clamp">${safe(details(e))}</div><button type="button" class="more" onclick="toggleDetails(this)">${T[lang].more}</button><div class="eventfoot">${num?`<a class="phone" href="tel:${safe(num)}">☎ ${safe(text(e.Phone))}</a>`:'<span class="phone">—</span>'}${links(e)}</div></article>`;}
window.toggleDetails=b=>{const d=b.previousElementSibling;d.classList.toggle('clamp');b.textContent=d.classList.contains('clamp')?T[lang].more:T[lang].less;};
function getSelect(id){return $(id).value;}function filtered(){const q=text(getSelect('query')).toLocaleLowerCase(),d=getSelect('district'),l=getSelect('location'),f=getSelect('from'),t=getSelect('to');return events.filter(e=>(!d||dis(e)===d)&&(!l||loc(e)===l)&&(!f||e.ToDate>=f)&&(!t||e.FromDate<=t)&&(!q||[temple(e),loc(e),dis(e),details(e),e.TempleML,e.TempleEN,e.ThiraDetailsML,e.ThiraDetailsEN].join(' ').toLocaleLowerCase().includes(q))).sort((a,b)=>a.FromDate.localeCompare(b.FromDate)||temple(a).localeCompare(temple(b)));}
function populateSelect(id,items,placeholder){const s=$(id),old=s.value;s.innerHTML='<option value="">'+safe(placeholder)+'</option>'+[...new Set(items.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');if([...s.options].some(o=>o.value===old))s.value=old;}function populateFilters(){populateSelect('district',events.map(dis),T[lang].allDist);const d=getSelect('district');populateSelect('location',events.filter(e=>!d||dis(e)===d).map(loc),T[lang].allLoc);}
function renderTable(list){if(!list.length){$('tableTarget').innerHTML='<div class="empty">'+T[lang].none+'</div>';return;}$('tableTarget').innerHTML=`<div class="tablewrap"><table class="desktop-table"><thead><tr><th>#</th><th>${T[lang].temple}</th><th>${T[lang].date}</th><th>${T[lang].details}</th><th>${T[lang].location}</th><th>${T[lang].phone}</th><th>${T[lang].actions}</th></tr></thead><tbody>${list.map((e,i)=>`<tr><td>${i+1}</td><td><b>${safe(temple(e))}</b></td><td>${safe(readable(e.FromDate))}<br>– ${safe(readable(e.ToDate))}</td><td class="detailCell">${safe(details(e))}</td><td>${safe(loc(e))}<br><small>${safe(dis(e))}</small></td><td>${phone(e)?`<a href="tel:${safe(phone(e))}">${safe(text(e.Phone))}</a>`:'—'}</td><td><div style="display:flex;gap:5px">${links(e)}</div></td></tr>`).join('')}</tbody></table></div>`;}
function renderCalendar(list){const y=calDate.getFullYear(),m=calDate.getMonth();$('monthTitle').textContent=calDate.toLocaleDateString(lang==='ml'?'ml-IN':'en-GB',{month:'long',year:'numeric'});const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),week=lang==='ml'?['ഞാ','തി','ചൊ','ബു','വ്യാ','വെ','ശ']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let html=week.map(d=>`<div class="dow">${d}</div>`).join('');for(let i=0;i<first;i++)html+='<div class="day blank"></div>';for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n=list.filter(e=>e.FromDate<=iso&&e.ToDate>=iso).length,today=new Date().toLocaleDateString('en-CA');html+=`<button class="day ${n?'has':''} ${selectedDay===iso?'selected':''} ${today===iso?'today':''}" data-day="${iso}" aria-label="${iso}, ${n} events"><span>${d}</span><span class="dots">${Array.from({length:Math.min(n,3)},(_,i)=>'<i class="dot"></i>').join('')}</span></button>`;}for(let i=(first+days)%7;i&&i<7;i++)html+='<div class="day blank"></div>';$('calGrid').innerHTML=html;$('calGrid').querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{selectedDay=selectedDay===b.dataset.day?null:b.dataset.day;render();}));$('calHint').textContent=selectedDay?`${readable(selectedDay)} · ${T[lang].hint}`:T[lang].hint;const inMonth=list.filter(e=>e.FromDate<=`${y}-${String(m+1).padStart(2,'0')}-${String(days).padStart(2,'0')}`&&e.ToDate>=`${y}-${String(m+1).padStart(2,'0')}-01`);const visible=selectedDay?inMonth.filter(e=>e.FromDate<=selectedDay&&e.ToDate>=selectedDay):inMonth;$('calendarEvents').innerHTML=visible.length?visible.map(card).join(''):`<div class="empty">${T[lang].none}</div>`;}
function render(){const list=filtered();$('count').textContent=T[lang].count(list.length);$('loaded').textContent=usingDemo?'DEMO':'';$('cardsTarget').innerHTML=list.length?list.map(card).join(''):`<div class="empty">${T[lang].none}</div>`;renderTable(list);renderCalendar(list);$('listSection').classList.toggle('hidden',view!=='list');$('calendarSection').classList.toggle('hidden',view!=='calendar');$('listTab').classList.toggle('active',view==='list');$('calendarTab').classList.toggle('active',view==='calendar');$('bottomList').classList.toggle('active',view==='list');$('bottomCalendar').classList.toggle('active',view==='calendar');}
function setView(v){view=v;selectedDay=null;render();}function setLanguage(v){lang=v;document.documentElement.lang=v;$('mlBtn').classList.toggle('active',v==='ml');$('enBtn').classList.toggle('active',v==='en');const t=T[lang];for(const [id,key] of [['searchLabel','search'],['districtLabel','district'],['locationLabel','location'],['fromLabel','from'],['toLabel','to'],['searchBtn','find'],['listTab','list'],['calendarTab','calendar'],['navList','list'],['navCalendar','calendar'],['navSearch','navSearch'],['disclaimer','disclaimer']])$(id).textContent=t[key];$('query').placeholder=t.searchP;populateFilters();$('warning').textContent=usingDemo?t.demo:'';render();}
$('mlBtn').onclick=()=>setLanguage('ml');$('enBtn').onclick=()=>setLanguage('en');$('listTab').onclick=()=>setView('list');$('calendarTab').onclick=()=>setView('calendar');$('bottomList').onclick=()=>setView('list');$('bottomCalendar').onclick=()=>setView('calendar');$('bottomTop').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'});$('query').focus();};$('prev').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);selectedDay=null;render();};$('next').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);selectedDay=null;render();};$('district').onchange=()=>{populateSelect('location',events.filter(e=>!getSelect('district')||dis(e)===getSelect('district')).map(loc),T[lang].allLoc);render();};['location','from','to','query'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',()=>{selectedDay=null;render();}));$('searchBtn').onclick=()=>render();$('resetBtn').onclick=()=>{['query','district','location','from','to'].forEach(id=>$(id).value='');populateFilters();selectedDay=null;render();};
async function init(){const url=GOOGLE_SHEET_CSV_URL.trim();if(!url||url.includes('PASTE_YOUR')){events=DEMO;usingDemo=true;$('warning').classList.remove('hidden');$('warning').textContent=T[lang].demo;populateFilters();render();return;}try{const res=await fetch(url+(url.includes('?')?'&':'?')+'_ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const csv=await res.text();const rows=parseCsv(csv);const required=['TempleML','FromDate','ToDate','DistrictML','LocationML'];if(!rows.length||required.some(k=>!(k in rows[0])))throw new Error('Missing required headers or no rows');events=rows.map(normalize).filter(x=>text(x.Status).toLowerCase()==='published'&&valid(x.FromDate)&&valid(x.ToDate)&&x.ToDate>=x.FromDate&&x.TempleML);usingDemo=false;$('warning').classList.add('hidden');}catch(err){console.error('Sheet load error',err);events=[];$('warning').classList.remove('hidden');$('warning').textContent=T[lang].error;}populateFilters();render();}init();
